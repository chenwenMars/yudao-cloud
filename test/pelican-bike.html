<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dff3fd;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  svg { width: min(96vw, 1000px); height: auto; display: block; }

  /* ====== 旋转类 ====== */
  .spin, .spin-rev, .rays {
    transform-box: view-box;
  }
  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes spin-rev  { to { transform: rotate(-360deg); } }

  .spokes-rear { transform-origin: 320px 440px; animation: spin 1.6s linear infinite; }
  .spokes-front{ transform-origin: 580px 440px; animation: spin 1.6s linear infinite; }

  /* 曲柄（牙盘脚踏）顺时针转 */
  .crank { transform-origin: 450px 430px; animation: spin 1.6s linear infinite; }
  /* 脚踏板反向自转，保持水平 */
  .pedal-a { transform-origin: 450px 396px; animation: spin-rev 1.6s linear infinite; }
  .pedal-b { transform-origin: 450px 464px; animation: spin-rev 1.6s linear infinite; }

  /* ====== 蹬腿的腿：绕髋关节小角度来回摆动 ====== */
  @keyframes leg-swing {
    0%, 100% { transform: rotate(-16deg); }
    25%      { transform: rotate(2deg); }
    50%      { transform: rotate(18deg); }
    75%      { transform: rotate(2deg); }
  }
  .leg-near { transform-origin: 412px 332px; animation: leg-swing 1.6s ease-in-out infinite; }
  .leg-far  { transform-origin: 408px 334px; animation: leg-swing 1.6s ease-in-out infinite;
              animation-delay: -0.8s; }

  /* ====== 身体上下小颠簸（与踩踏同步） ====== */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .rider-body { animation: bob 0.8s ease-in-out infinite; }

  /* ====== 翅膀扇动 ====== */
  @keyframes flap {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(14deg); }
  }
  .wing { transform-origin: 388px 296px; animation: flap 1.2s ease-in-out infinite; }

  /* ====== 头部小幅点头 ====== */
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(3.5deg); }
  }
  .head { transform-origin: 452px 262px; animation: nod 1.6s ease-in-out infinite; }

  /* ====== 背景运动 ====== */
  @keyframes drift {
    from { transform: translateX(980px); }
    to   { transform: translateX(-260px); }
  }
  .cloud1 { animation: drift 46s linear infinite; }
  .cloud2 { animation: drift 63s linear infinite; animation-delay: -22s; }
  .cloud3 { animation: drift 80s linear infinite; animation-delay: -48s; }

  /* 地面虚线向后跑，制造前进感 */
  @keyframes dash-move { to { stroke-dashoffset: -48; } }
  .road-line { animation: dash-move 0.55s linear infinite; }

  /* 小草/小花从右向左掠过 */
  @keyframes pass-by {
    from { transform: translateX(940px); }
    to   { transform: translateX(-80px); }
  }
  .tuft1 { animation: pass-by 3.2s linear infinite; }
  .tuft2 { animation: pass-by 3.2s linear infinite; animation-delay: -1.1s; }
  .tuft3 { animation: pass-by 3.2s linear infinite; animation-delay: -2.2s; }

  /* 速度线 */
  @keyframes whoosh {
    0%   { opacity: 0; transform: translateX(0); }
    30%  { opacity: .7; }
    100% { opacity: 0; transform: translateX(-90px); }
  }
  .speed-line { animation: whoosh 0.9s linear infinite; }
  .speed-line.s2 { animation-delay: -0.3s; }
  .speed-line.s3 { animation-delay: -0.6s; }

  .rays { transform-origin: 130px 110px; animation: spin 40s linear infinite; }

  .caption { fill: #2b6cb0; font-size: 26px; font-weight: 700; }
</style>
</head>
<body>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8fb"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
  </defs>

  <!-- 天空与地面 -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>
  <rect x="0" y="500" width="900" height="100" fill="#bfe3b4"/>
  <rect x="0" y="500" width="900" height="14" fill="#a8d89e"/>

  <!-- 太阳 -->
  <g>
    <g class="rays" stroke="#f6c945" stroke-width="6" stroke-linecap="round">
      <line x1="130" y1="40"  x2="130" y2="20"/>
      <line x1="130" y1="200" x2="130" y2="180"/>
      <line x1="60"  y1="110" x2="40"  y2="110"/>
      <line x1="220" y1="110" x2="200" y2="110"/>
      <line x1="80"  y1="60"  x2="66"  y2="46"/>
      <line x1="194" y1="174" x2="180" y2="160"/>
      <line x1="194" y1="46"  x2="180" y2="60"/>
      <line x1="80"  y1="160" x2="66"  y2="174"/>
    </g>
    <circle cx="130" cy="110" r="42" fill="#ffd95e" stroke="#f6c945" stroke-width="5"/>
  </g>

  <!-- 云 -->
  <g fill="#ffffff" opacity="0.95">
    <g class="cloud1"><ellipse cx="0" cy="90" rx="52" ry="22"/><ellipse cx="40" cy="80" rx="40" ry="18"/><ellipse cx="-42" cy="82" rx="34" ry="15"/></g>
    <g class="cloud2"><ellipse cx="0" cy="160" rx="46" ry="18"/><ellipse cx="36" cy="150" rx="34" ry="15"/><ellipse cx="-36" cy="152" rx="28" ry="12"/></g>
    <g class="cloud3"><ellipse cx="0" cy="60" rx="38" ry="15"/><ellipse cx="30" cy="52" rx="28" ry="12"/></g>
  </g>

  <!-- 远山 -->
  <path d="M0 500 Q 120 400 260 500 Z" fill="#9ed0a8"/>
  <path d="M200 500 Q 360 380 520 500 Z" fill="#8cc79a"/>
  <path d="M480 500 Q 660 390 840 500 Z" fill="#9ed0a8"/>

  <!-- 路面虚线 -->
  <line class="road-line" x1="0" y1="512" x2="900" y2="512"
        stroke="#7fbf72" stroke-width="6" stroke-dasharray="28 20"/>

  <!-- 掠过的小草 -->
  <g stroke="#5da85c" stroke-width="4" stroke-linecap="round">
    <g class="tuft1"><path d="M0 500 q -4 -14 -8 -18 M0 500 q 0 -16 0 -22 M0 500 q 4 -14 8 -18" fill="none"/></g>
    <g class="tuft2"><path d="M0 500 q -4 -12 -8 -16 M0 500 q 0 -14 0 -20 M0 500 q 4 -12 8 -16" fill="none"/>
      <circle cx="0" cy="-24" r="5" fill="#ff8fab" stroke="none" transform="translate(0 500)"/></g>
    <g class="tuft3"><path d="M0 500 q -4 -14 -8 -18 M0 500 q 0 -16 0 -22 M0 500 q 4 -14 8 -18" fill="none"/></g>
  </g>

  <!-- 速度线 -->
  <g stroke="#9ecbe8" stroke-width="6" stroke-linecap="round">
    <line class="speed-line"    x1="250" y1="360" x2="180" y2="360"/>
    <line class="speed-line s2" x1="240" y1="420" x2="150" y2="420"/>
    <line class="speed-line s3" x1="250" y1="480" x2="190" y2="480"/>
  </g>

  <!-- ================= 自行车 ================= -->
  <g stroke-linecap="round">
    <!-- 后轮 -->
    <circle cx="320" cy="440" r="70" fill="none" stroke="#3a3f4b" stroke-width="12"/>
    <circle cx="320" cy="440" r="60" fill="none" stroke="#c9d2dd" stroke-width="4"/>
    <g class="spokes-rear" stroke="#8b95a5" stroke-width="3">
      <line x1="320" y1="384" x2="320" y2="496"/>
      <line x1="264" y1="440" x2="376" y2="440"/>
      <line x1="280" y1="400" x2="360" y2="480"/>
      <line x1="360" y1="400" x2="280" y2="480"/>
    </g>
    <circle cx="320" cy="440" r="9" fill="#57606f"/>

    <!-- 前轮 -->
    <circle cx="580" cy="440" r="70" fill="none" stroke="#3a3f4b" stroke-width="12"/>
    <circle cx="580" cy="440" r="60" fill="none" stroke="#c9d2dd" stroke-width="4"/>
    <g class="spokes-front" stroke="#8b95a5" stroke-width="3">
      <line x1="580" y1="384" x2="580" y2="496"/>
      <line x1="524" y1="440" x2="636" y2="440"/>
      <line x1="540" y1="400" x2="620" y2="480"/>
      <line x1="620" y1="400" x2="540" y2="480"/>
    </g>
    <circle cx="580" cy="440" r="9" fill="#57606f"/>

    <!-- 车架 -->
    <g stroke="#e05252" stroke-width="9" fill="none">
      <line x1="320" y1="440" x2="450" y2="430"/>   <!-- 后下叉 -->
      <line x1="320" y1="440" x2="392" y2="338"/>   <!-- 后上叉 -->
      <line x1="392" y1="338" x2="450" y2="430"/>   <!-- 座管 -->
      <line x1="392" y1="338" x2="548" y2="332"/>   <!-- 上管 -->
      <line x1="450" y1="430" x2="556" y2="344"/>   <!-- 下管 -->
      <line x1="556" y1="344" x2="580" y2="440"/>   <!-- 前叉 -->
      <line x1="548" y1="332" x2="556" y2="344"/>   <!-- 头管 -->
    </g>
    <!-- 车座 -->
    <path d="M368 332 q 24 -14 52 -2 q 4 6 -4 9 l -44 4 q -10 -3 -4 -11 Z" fill="#3a3f4b"/>
    <!-- 车把 -->
    <path d="M552 336 q 6 -26 20 -34 q 10 -6 20 0" fill="none" stroke="#3a3f4b" stroke-width="8"/>
    <circle cx="592" cy="302" r="7" fill="#e05252"/>

    <!-- 曲柄 + 脚踏 -->
    <g class="crank">
      <line x1="450" y1="396" x2="450" y2="464" stroke="#57606f" stroke-width="8"/>
      <g class="pedal-a"><rect x="432" y="390" width="36" height="10" rx="4" fill="#3a3f4b"/></g>
      <g class="pedal-b"><rect x="432" y="458" width="36" height="10" rx="4" fill="#3a3f4b"/></g>
    </g>
    <circle cx="450" cy="430" r="13" fill="#57606f" stroke="#3a3f4b" stroke-width="3"/>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g class="rider-body">
    <!-- 远侧腿（深色） -->
    <g class="leg-far" stroke="#d98e2b" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M408 334 L 442 392 L 450 396"/>
    </g>

    <!-- 尾巴 -->
    <path d="M330 300 q -30 4 -44 22 q 26 8 50 2 Z" fill="#e8e8e0" stroke="#cfcfc4" stroke-width="3"/>

    <!-- 身体 -->
    <ellipse cx="400" cy="302" rx="72" ry="58" fill="#f7f7f0" stroke="#d9d9cd" stroke-width="4"/>

    <!-- 近侧腿 -->
    <g class="leg-near" stroke="#f2a93b" stroke-width="12" fill="none" stroke-linecap="round">
      <path d="M412 332 L 446 392 L 450 396"/>
      <!-- 大脚蹼 -->
      <path d="M450 396 l 18 -3 M450 396 l 16 6 M450 396 l 10 12" stroke-width="6"/>
    </g>

    <!-- 翅膀 -->
    <g class="wing">
      <path d="M388 296 q 58 -6 82 34 q -6 40 -58 44 q -34 -4 -24 -78 Z"
            fill="#efefe6" stroke="#cfcfc4" stroke-width="4"/>
      <path d="M400 330 q 30 4 44 22" fill="none" stroke="#cfcfc4" stroke-width="3"/>
    </g>

    <!-- 脖子 + 头（整体点头动画） -->
    <g class="head">
      <!-- S 形脖子 -->
      <path d="M446 268 q 22 -18 24 -44 q 2 -22 14 -30"
            fill="none" stroke="#f7f7f0" stroke-width="34" stroke-linecap="round"/>
      <path d="M446 268 q 22 -18 24 -44 q 2 -22 14 -30"
            fill="none" stroke="#d9d9cd" stroke-width="38" stroke-linecap="round" opacity="0.25"/>
      <!-- 头 -->
      <circle cx="492" cy="188" r="26" fill="#f7f7f0" stroke="#d9d9cd" stroke-width="4"/>
      <!-- 眼睛 -->
      <circle cx="500" cy="182" r="4.5" fill="#2b2b2b"/>
      <circle cx="501.5" cy="180.5" r="1.5" fill="#fff"/>
      <!-- 长喙（上喙） -->
      <path d="M514 184 L 646 208 q 6 3 0 7 L 516 200 Z" fill="#f2a93b" stroke="#d98e2b" stroke-width="3"/>
      <!-- 喉囊 -->
      <path d="M516 200 L 644 214 q -4 26 -34 30 q -60 8 -94 -26 Z"
            fill="#f6c46b" stroke="#d98e2b" stroke-width="3"/>
      <!-- 小红头盔 -->
      <path d="M468 176 q 4 -24 26 -26 q 22 2 24 24 q -26 -10 -50 2 Z"
            fill="#e05252" stroke="#b03a3a" stroke-width="3"/>
      <circle cx="494" cy="150" r="4" fill="#ffd95e"/>
    </g>
  </g>

  <text class="caption" x="450" y="566" text-anchor="middle">鹈鹕骑行记 · Pelican on a Bike</text>
</svg>
</body>
</html>
